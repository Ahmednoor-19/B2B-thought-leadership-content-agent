<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>B2B content agent architecture</title>
<desc>Four trigger types feed a shared draft engine with an optional relevance check and schema-enforced LLM generation, which saves a doc and sends an email alert, ending at mandatory human review before anything is posted manually.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="107.5" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Schedule</text>
<text x="107.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Tue &amp; Thu 7am</text>

<rect x="190" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="257.5" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">News feed</text>
<text x="257.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Auto news scan</text>

<rect x="340" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="407.5" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Comment hook</text>
<text x="407.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">LinkedIn reply</text>

<rect x="490" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="557.5" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Speaker hook</text>
<text x="557.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Speaker call</text>

<line x1="107.5" y1="96" x2="107.5" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="257.5" y1="96" x2="257.5" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="407.5" y1="96" x2="407.5" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="557.5" y1="96" x2="557.5" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="140" width="480" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="166" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Draft engine</text>

<rect x="130" y="190" width="190" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="225" y="214" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Relevance check</text>
<text x="225" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">News &amp; speaker hook only</text>

<rect x="340" y="190" width="220" height="80" rx="12" fill="#EEEDFE" stroke="#3C3489" stroke-width="0.5"/>
<text x="450" y="214" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Generate draft</text>
<text x="450" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Schema-enforced JSON</text>

<line x1="320" y1="230" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="340" y1="290" x2="240" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="290" x2="480" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="340" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="240" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Draft saved</text>
<text x="240" y="380" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Google Doc created</text>

<rect x="380" y="340" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Email alert</text>
<text x="480" y="380" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Link to review</text>

<line x1="240" y1="396" x2="270" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="396" x2="410" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="420" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Human review</text>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Edits &amp; approves</text>

<line x1="340" y1="476" x2="340" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="500" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="516" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Posted manually</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Only if approved</text>
</svg>
